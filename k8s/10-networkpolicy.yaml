# =============================================================
# NetworkPolicy — stm-localizacao
# Define quem pode falar com o stm-localizacao e com quem ele fala.
# Requer um CNI que suporte NetworkPolicy (Calico, Cilium, etc.)
# =============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stm-localizacao-netpol
  namespace: ms
  labels:
    app: stm-localizacao
    component: network-policy
    managed-by: kubectl
    org: stm
spec:
  podSelector:
    matchLabels:
      app: stm-localizacao

  policyTypes:
    - Ingress
    - Egress

  # ---------------------------------------------------------
  # Ingress — quem pode enviar tráfego PARA o stm-localizacao
  # ---------------------------------------------------------
  ingress:
    # Permite tráfego do NGINX Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8081
          protocol: TCP

    # Permite tráfego de outros microsserviços do namespace ms
    - from:
        - namespaceSelector:
            matchLabels:
              name: ms
      ports:
        - port: 8081
          protocol: TCP

    # Permite scrape do Prometheus (namespace monitoring)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8081
          protocol: TCP

  # ---------------------------------------------------------
  # Egress — com quem o stm-localizacao pode se comunicar
  # ---------------------------------------------------------
  egress:
    # Permite acesso ao MySQL dentro do namespace ms
    - to:
        - namespaceSelector:
            matchLabels:
              name: ms
          podSelector:
            matchLabels:
              app: mysql-stm-localizacao
      ports:
        - port: 3306
          protocol: TCP

    # Permite resolução DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
